<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FromOvenToMarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-100 via-yellow-50 to-pink-100 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-lg bg-white shadow-2xl rounded-3xl p-8 border border-pink-200">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-pink-500">
        🧁 FromOvenToMarket
      </h1>
      <p class="text-gray-500 mt-2">
        Form Pre-Order Untuk Pemesanan Kue
      </p>
    </div>

    <!-- Alert Success -->
    <div id="alert-success"
      class="hidden mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-xl">
      ✅ Pesanan berhasil dikirim!
    </div>

    <!-- Alert Error -->
    <div id="alert-error"
      class="hidden mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl">
      ❌ Terjadi kesalahan, coba lagi.
    </div>

    <form id="submission-form">

      <!-- Nama -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Nama Pemesan <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          placeholder="Contoh: Abby"
          class="w-full px-4 py-3 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
      </div>

      <!-- WhatsApp -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Nomor WhatsApp <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          placeholder="08xxxxxxxxxx"
          class="w-full px-4 py-3 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
      </div>

      <!-- Jenis Kue -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Jenis Kue Yang Dipesan <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          placeholder="Contoh: Cinnamon Roll"
          class="w-full px-4 py-3 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
      </div>

      <!-- Tanggal Pengambilan -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Tanggal Pengambilan <span class="text-red-500">*</span>
        </label>
        <input
          type="date"
          class="w-full px-4 py-3 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
      </div>

      <!-- Catatan -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Catatan
        </label>
        <textarea
          rows="4"
          placeholder="Tambahkan catatan pesanan..."
          class="w-full px-4 py-3 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300 resize-none"></textarea>
      </div>

      <!-- Tombol -->
      <button
        type="submit"
        class="w-full bg-gradient-to-r from-pink-400 to-yellow-300 hover:from-pink-500 hover:to-yellow-400 text-white font-bold py-3 rounded-xl shadow-lg transition duration-300">
        🍰 Kirim Pesanan
      </button>

    </form>

  </div>

</body>
</html>
