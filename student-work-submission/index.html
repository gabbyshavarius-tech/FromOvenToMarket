<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Work Submission</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-lg bg-white shadow-lg rounded-xl p-8">
    <!-- Header -->
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-gray-800">FromOvenToMarket</h1>
      <p class="text-sm text-gray-500 mt-1">Isi form di bawah untuk mengumpulkan karya kamu</p>
    </div>

    <!-- Alert Success -->
    <div id="alert-success" class="hidden mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm">
      ✅ Karya berhasil dikirim!
    </div>

    <!-- Alert Error -->
    <div id="alert-error" class="hidden mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
      ❌ <span id="error-message">Terjadi kesalahan, coba lagi.</span>
    </div>

    <!-- Form -->
    <form id="submission-form" novalidate>

      <!-- Nama Siswa -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="nama">Nama Siswa <span class="text-red-500">*</span></label>
        <input id="nama" type="text" placeholder="Contoh: Abby"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
        <p class="text-red-500 text-xs mt-1 hidden" id="err-nama">Nama wajib diisi.</p>
      </div>

      <!-- Kelas -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="kelas">Kelas <span class="text-red-500">*</span></label>
        <input id="kelas" type="text" placeholder="Contoh: XI RPL"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
        <p class="text-red-500 text-xs mt-1 hidden" id="err-kelas">Kelas wajib diisi.</p>
      </div>

      <!-- Judul Karya -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="judul">Judul Karya <span class="text-red-500">*</span></label>
        <input id="judul" type="text" placeholder="Contoh: Website Toko Bakery"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
        <p class="text-red-500 text-xs mt-1 hidden" id="err-judul">Judul karya wajib diisi.</p>
      </div>

      <!-- Link Project -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="link">Link Project <span class="text-red-500">*</span></label>
        <input id="link" type="url" placeholder="https://github.com/username/repo"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
        <p class="text-red-500 text-xs mt-1 hidden" id="err-link">Harga Satuan</p>
      </div>

      <!-- Deskripsi -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="deskripsi">Deskripsi <span class="text-gray-400 text-xs">(opsional)</span></label>
        <textarea id="deskripsi" rows="3" placeholder="Ceritakan sedikit tentang karya kamu..."
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition resize-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2">
        <span id="btn-text">Kirim Karya</span>
        <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
      </button>

    </form>


  </div>

  <script src="script.js"></script>
</body>
</html>
